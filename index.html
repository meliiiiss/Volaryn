<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Cinzel&family=Libre+Baskerville&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">

<title>Volaryon</title>
</head>
<body>
<audio id="bgSound" loop preload="auto">
  <source src="assets/fog.mp3" type="audio/mp3">
</audio>
<div id="intro">

  <div class="fog"></div>

  <div class="intro-text">
    <p id="line1"></p>
    <p id="line2"></p>
    <p id="line3"></p>
  </div>

  <button id="enterBtn">Entrar em Volaryon</button>

</div>

<div class="menu">
...
</div>

<div class="card">
...
</div>

<script>
  
const lines = [
  "Antes do tempo… não havia forma.",
  "Antes da luz… não havia nome.",
  "Apenas a Névoa Primordial existia."
];

const p1 = document.getElementById("line1");
const p2 = document.getElementById("line2");
const p3 = document.getElementById("line3");
const btn = document.getElementById("enterBtn");
const sound = document.getElementById("bgSound");

// 🔊 ativa o som no primeiro clique (obrigatório no navegador)
document.addEventListener("click", () => {
  if (sound) {
    sound.volume = 0.15; // baixo e ambiente
    sound.play();
  }
}, { once: true });
// ✍️ TYPEWRITER
function typeText(element, text, delay, callback) {
  let index = 0;
  element.textContent = "";
  element.style.opacity = 1;

  const interval = setInterval(() => {
    element.textContent += text.charAt(index);
    index++;

    if (index >= text.length) {
      clearInterval(interval);
      if (callback) callback();
    }
  }, 40);

  setTimeout(() => {
    clearInterval(interval);
    if (callback) callback();
  }, delay);
}

// 🌑 sequência da intro
setTimeout(() => {
  typeText(p1, lines[0], 2000);
}, 1000);

setTimeout(() => {
  typeText(p2, lines[1], 2000);
}, 3500);

setTimeout(() => {
  typeText(p3, lines[2], 2000);
}, 6000);

// 🎮 botão aparece depois
setTimeout(() => {
  btn.style.opacity = 1;
}, 9000);

// 🌫️ entrar no mundo
btn.addEventListener("click", () => {
  document.getElementById("intro").style.opacity = "0";

  setTimeout(() => {
    document.getElementById("intro").style.display = "none";
  }, 1500);
});
</script>

</body>
</html>

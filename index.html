<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Cinzel&family=Libre+Baskerville&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">

<title>Volaryon</title>
</head>
<body>
  <script>
const lines = [
  "Antes do tempo… não havia forma.",
  "Antes da luz… não havia nome.",
  "Apenas a Névoa Primordial existia."
];

const p1 = document.getElementById("line1");
const p2 = document.getElementById("line2");
const p3 = document.getElementById("line3");
const btn = document.getElementById("enterBtn");

function showLine(el, text, delay) {
  setTimeout(() => {
    el.textContent = text;
    el.style.opacity = 1;
  }, delay);
}

showLine(p1, lines[0], 1000);
showLine(p2, lines[1], 3500);
showLine(p3, lines[2], 6000);

setTimeout(() => {
  btn.style.opacity = 1;
}, 9000);

btn.addEventListener("click", () => {
  document.getElementById("intro").style.opacity = "0";

  setTimeout(() => {
    document.getElementById("intro").style.display = "none";
  }, 1500);
});
  </script>
<div id="intro">

  <div class="fog"></div>

  <div class="intro-text">
    <p id="line1"></p>
    <p id="line2"></p>
    <p id="line3"></p>
  </div>

  <button id="enterBtn">Entrar em Volaryon</button>

</div>
<div class="menu">
  <span class="logo">🌑 Volaryon</span>

  <div class="links">
    <a href="index.html">Início</a>
    <a href="racas.html">Raças</a>
    <a href="classes.html">Classes</a>
  </div>
</div>
<div class="card">
  <h2>Bem-vindo</h2>
  <p>O mundo de Volaryon começa a tomar forma...</p>
</div>

</body>

</html>

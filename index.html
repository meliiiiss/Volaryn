<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Volaryon RPG</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel&family=Libre+Baskerville&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/intro.css">
</head>

<body>

<!-- 🌑 INTRO -->
<div id="intro">
  <div class="intro-text">
    <p>Bem-vindo a Volaryon</p>
    <p>Um mundo onde sombras respiram</p>
    <p>Seu destino começa agora...</p>

    <button onclick="entrarSite()">Entrar</button>
  </div>
</div>

<!-- 🎵 ÁUDIOS -->
<audio id="portalSound">
  <source src="assets/portal.mp3" type="audio/mp3">
</audio>

<audio id="musica" loop>
  <source src="audio/theme.mp3" type="audio/mp3">
</audio>

<!-- 🌑 SITE -->
<div id="site" style="display:none;">
  <header>
    <h1>🌑 Volaryon RPG</h1>
    <p>Um mundo onde sombras respiram</p>
  </header>

  <div class="game-ui">
    <div class="menu-jogo">
      <h2>MENU</h2>
      <button>🔐 Entrar</button>
      <button>⚙️ Configurações</button>
    </div>
  </div>
</div>

<script src="script.js"></script>
  
</body>
</html>
